name: Push release to Cocoapods

# Releases are now cut in GitLab CI, which bumps the version and creates a
# plain `X.Y.Z` tag. That tag is replicated here by the GitLab -> GitHub mirror,
# but a mirrored tag push does NOT raise a `release: published` event, so this
# workflow triggers on the tag push instead. Downstream repo dispatch (Flutter /
# React Native) is handled on the GitLab side, so it is no longer invoked here.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  cocoapods:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # 3.6.0
      - name: Deploy to CocoaPods
        run: |
          set -eo pipefail
          gem install cocoapods
          pod lib lint --allow-warnings
          pod trunk push --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
